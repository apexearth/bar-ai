name: release

# A v* tag builds SkirmishAI.dll from the pins in .github/release.env and
# publishes the host-install zip as a GitHub Release. A manual run builds the
# same zip as a workflow artifact without releasing it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Load pins
        run: grep -E '^[A-Z_]+=' .github/release.env >> "$GITHUB_ENV"

      - name: Fetch engine source
        run: |
          git clone --depth 1 --branch "$ENGINE_REF" --recurse-submodules \
            --shallow-submodules --jobs 8 "$ENGINE_REPO" engine

      - name: Check out the apex C++
        working-directory: engine/AI/Skirmish/BARb
        run: |
          git remote add apex "$CIRCUITAI_REPO"
          git fetch --depth 1 apex "$CIRCUITAI_SHA"
          git checkout --detach FETCH_HEAD

      # cpp/ is the mirror the repo tracks; if it is not the pinned commit, the
      # release would ship C++ nobody can name. Line endings are ignored: bar-ai
      # stores LF, the fork keeps upstream's CRLF in a few files.
      - name: cpp/ must match CIRCUITAI_SHA
        working-directory: engine/AI/Skirmish/BARb
        run: |
          cp -r "$GITHUB_WORKSPACE/cpp/src/." src/
          extra=$(git ls-files --others --exclude-standard src)
          if [ -n "$extra" ] || ! git diff --ignore-cr-at-eol --quiet; then
            echo "$extra"
            git diff --ignore-cr-at-eol --stat
            echo "::error::cpp/src differs from $CIRCUITAI_SHA -- push the fork and bump CIRCUITAI_SHA in .github/release.env"
            exit 1
          fi
          git checkout -- src

      - uses: actions/cache@v4
        with:
          path: ccache
          key: ccache-${{ env.ENGINE_REF }}-${{ env.CIRCUITAI_SHA }}
          restore-keys: ccache-${{ env.ENGINE_REF }}-

      - name: Build SkirmishAI.dll
        run: |
          mkdir -p build ccache
          docker run --rm \
            -v /etc/passwd:/etc/passwd:ro -v /etc/group:/etc/group:ro \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/engine":/build/src:ro \
            -v "$PWD/ccache":/build/cache \
            -v "$PWD/build":/build/out \
            -e CCACHE_DIR=/build/cache \
            "$BUILD_IMAGE" bash -c '
              set -e
              /build/src/docker-build-v2/scripts/configure.sh
              ninja -C /build/out BARb
              x86_64-w64-mingw32-strip -o /build/out/SkirmishAI.dll \
                /build/out/AI/Skirmish/BARb/data/SkirmishAI.dll'
          ls -la build/SkirmishAI.dll

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package
        run: |
          label="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || label="${GITHUB_SHA::8}"
          python tools/package_ai.py "$VARIANT" --out dist \
            --base-dir engine/AI/Skirmish/BARb/data \
            --dll build/SkirmishAI.dll \
            --engine "$ENGINE_NAME" --label "$label"

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one obvious file to take: GitHub adds its own "Source code" archives of the whole repository beside it
          zip="dist/Apex-AI-${GITHUB_REF_NAME}-INSTALL.zip"
          mv dist/*.zip "$zip"
          size=$(du -m "$zip" | cut -f1)
          cat > notes.md <<EOF
          ## To play against it, download **Apex-AI-${GITHUB_REF_NAME}-INSTALL.zip** below (about ${size} MB)

          Do not download "Source code (zip)" or "Source code (tar.gz)": those are the whole development repository,
          very large, and have no installer.

          1. Close Beyond All Reason.
          2. Right-click the zip, choose **Extract All**, open the extracted folder and double-click **Install.bat**.
             It finds BAR, copies the AI in, and switches the lobby to its full AI list (Apex is hidden in the
             simple list).
          3. Start BAR. In a skirmish or a lobby you host, **Add AI** and pick **Apex ${GITHUB_REF_NAME}**.

          Only the player hosting the game needs it. Built for BAR engine \`${ENGINE_NAME}\`; after a BAR engine
          update, run Install.bat again. If Apex still does not show in the AI list, see INSTALL.txt in the zip.

          C++: ${CIRCUITAI_SHA}
          EOF
          gh release create "$GITHUB_REF_NAME" "$zip" --title "Apex AI $GITHUB_REF_NAME" --notes-file notes.md
